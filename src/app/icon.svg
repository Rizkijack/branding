<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon / app icon. Kept as a hand-written SVG rather than a PNG so it
    scales to any size and stays a reviewable text file.

    Next.js App Router serves this automatically at /icon.svg and adds the
    <link rel="icon"> tag to every page.
  -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8a5cf6"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b4ce0"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0b0b14"/>

  <!-- Upper pyramid -->
  <path d="M16 4 L7 17 L16 20 L25 17 Z" fill="url(#top)"/>
  <!-- Lower pyramid -->
  <path d="M16 28 L7 17 L16 20 L25 17 Z" fill="url(#bottom)"/>
  <!-- Waist seam -->
  <path d="M7 17 H25" stroke="#0b0b14" stroke-opacity=".35" stroke-width="1"/>
</svg>